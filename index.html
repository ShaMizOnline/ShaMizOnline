<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShaMiz – Style By Choice</title>
<style>
:root{--gold:#c9a45c;--ink:#171717;--muted:#666}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:28px 16px;background:linear-gradient(145deg,#111,#29231b);font-family:Arial,Helvetica,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:480px;padding:34px 24px 28px;border:1px solid rgba(201,164,92,.7);border-radius:24px;background:#181818;box-shadow:0 18px 55px #0008;text-align:center}
.brand{font-size:42px;font-weight:800;letter-spacing:2px;color:var(--gold);margin:0}
.tag{font-size:13px;letter-spacing:3px;margin:8px 0 7px}
.slogan{font-size:11px;letter-spacing:1.5px;color:#c9a45c;margin:0 0 28px}
.links{display:grid;gap:12px}
.link{display:flex;align-items:center;justify-content:center;gap:11px;padding:16px 14px;border:1px solid #5d4b2d;border-radius:13px;background:#222;color:#fff;text-decoration:none;font-size:16px;font-weight:700;transition:.15s}
.link:hover{background:#302719;border-color:var(--gold)}
.icon{font-size:20px}
.hotline{margin-top:25px;padding-top:20px;border-top:1px solid #51452f}
.hotline h2{font-size:13px;letter-spacing:2px;color:var(--gold);margin:0 0 13px}
.numbers{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.phone{color:#fff;text-decoration:none;border:1px solid #51452f;border-radius:9px;padding:10px 12px;font-weight:700}
.footer{margin:24px 0 0;color:#aaa;font-size:11px;letter-spacing:1.2px}
</style>
</head>
<body>
<main class="card">
  <h1 class="brand">ShaMiz</h1>
  <div class="tag">STYLE BY CHOICE</div>
  <p class="slogan">BRAND QUALITY AT LOCAL PRICE</p>
  <nav class="links" aria-label="ShaMiz links">
    <a class="link" href="https://www.facebook.com/ShaMizOnline" target="_blank" rel="noopener"><span class="icon">ⓕ</span> Facebook Page</a>
    <a class="link" href="https://shamizonline.pathao.shop/" target="_blank" rel="noopener"><span class="icon">🛍</span> Online Shop / Website</a>
    <a class="link" href="https://maps.app.goo.gl/oXoxvQH5MNWm2JyB8" target="_blank" rel="noopener"><span class="icon">📍</span> Showroom Location</a>
    <a class="link" href="https://wa.me/8801570240552" target="_blank" rel="noopener"><span class="icon">☏</span> WhatsApp</a>
  </nav>
  <section class="hotline">
    <h2>HOTLINE</h2>
    <div class="numbers">
      <a class="phone" href="tel:+8801570240552">01570240552</a>
      <a class="phone" href="tel:+8801570240553">01570240553</a>
    </div>
  </section>
  <p class="footer">QUALITY YOU CAN TRUST</p>
</main>
</body>
</html>
